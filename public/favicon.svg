<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#08080a" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Stylized Sneaker Silhouette with Monogram 'S' -->
  <g transform="translate(8, 12)">
    <!-- Sneaker Collar and Heel -->
    <path d="M12 4 L22 4 L26 12 L38 20 L44 24 L44 28 L3 28 L3 16 L12 4 Z" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sole Line -->
    <path d="M1 28 L47 28 C47 31 43 33 40 33 L3 33 C1 33 1 30 1 28 Z" fill="url(#gold)" opacity="0.9" />
    <line x1="6" y1="30.5" x2="42" y2="30.5" stroke="#08080a" stroke-width="1" stroke-dasharray="2,2" />
    <!-- Laces / Speed line -->
    <path d="M22 6 L36 17 L46 22" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Monogram Stylized S in Quarter -->
    <path d="M20 12 C16 12 14 14 14 16 C14 19 22 18 22 22 C22 25 18 25 15 25" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
